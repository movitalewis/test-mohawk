# ============================================
# CLOUD BUILD: REGULAR DEPLOYMENTS (All Environments)
# ============================================
#
# Fast deployment - only builds and deploys (no LB changes)
#
# Usage:
#   DEV:     gcloud builds submit --config=cloudbuild-cloudrun.yaml --substitutions=_ENV=dev,_DEPLOY_PROJECT=fna-ui-mx-dev-mhk
#   STAGING: gcloud builds submit --config=cloudbuild-cloudrun.yaml --substitutions=_ENV=staging,_DEPLOY_PROJECT=fna-ui-mx-stg-mhk
#   QA:      gcloud builds submit --config=cloudbuild-cloudrun.yaml --substitutions=_ENV=qa,_DEPLOY_PROJECT=fna-ui-mx-qa-mhk
#   PROD:    gcloud builds submit --config=cloudbuild-cloudrun.yaml --substitutions=_ENV=production,_DEPLOY_PROJECT=fna-ui-mx-prd-mhk
#
# First time? Run cloudbuild-cloudrun-setup.yaml instead
# ============================================

substitutions:
  _ENV: 'dev'
  _DEPLOY_PROJECT: 'fna-ui-mx-dev-mhk'
  _REGION: 'us-central1'
  _REPO_NAME: 'angular-ssr-repo'
  _SERVICE_NAME: 'fna-ui-xchange-ssr'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _MEMORY: '1Gi'
  _CPU: '1'
  _NODE_VERSION: '22'

steps:
  # Step 1: npm install
  - id: 'npm-install'
    name: 'node:${_NODE_VERSION}'
    entrypoint: bash
    args:
      - -c
      - npm install --legacy-peer-deps

  # Step 2: Build Angular SSR
  - id: 'npm-build'
    name: 'node:${_NODE_VERSION}'
    entrypoint: bash
    args:
      - -c
      - |
        echo "Building for environment: ${_ENV}"
        if [ "${_ENV}" = "production" ]; then
          NODE_OPTIONS="--max-old-space-size=8192" npm run build-${_ENV}:ssr
        else
          npm run build-${_ENV}:ssr
        fi
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'

  # Step 3: Build Docker image
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - -f
      - Dockerfile.cloudrun
      - .

  # Step 4: Push image
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}

  # Step 5: Deploy to Cloud Run
  - id: 'deploy-cloudrun'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}
      - --project=${_DEPLOY_PROJECT}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --ingress=all
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=${_ENV}
      - --concurrency=80
      - --timeout=300s

images:
  - ${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_DEPLOY_PROJECT}/${_REPO_NAME}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '3600s'
