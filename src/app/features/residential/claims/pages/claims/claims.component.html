   <!-- Header Section (Responsive) -->
  <div class="row align-items-center text-center text-md-start mb-3 claim-container-header">

    <!-- Back Link -->
    <!-- <div class="col-12 col-md-4 mb-2 mb-md-0 align-self-end text-start claim-header-left">
      <a routerLink="/residential/claims/history" class="text-danger d-inline-block text-decoration-none back-to-claims-link">
        <img src="assets/images/icons/back-icon.svg" class="back-icon" alt="back-icon"> Back To Claims
      </a>
    </div> -->

    <!-- Title and Subtitle -->
    <div class="col-12 text-center claim-header-center">
      <h2 class="text-center mb-1 page-title">Create A New Claim</h2>
      <p class="mb-0 page-p">Please select a claim type to continue.</p>
    </div>

    <!-- Empty right column for balance (optional) -->
    <!-- <div class="col-12 col-md-4 d-none d-md-block claim-header-end"></div> -->
  </div>
  <!-- Divider -->
  <hr class="my-4" />
  <div class="row claim-cards-container d-flex flex-wrap gap-31px">
    <div 
      class="col-12 col-md-4 col-xl-3 claim-col"
      *ngFor="let card of claimTypesData"
    >
      <div 
        class="card h-100 shadow-sm custom-card-hover d-flex text-center claim-custom-card"
        [routerLink]="[card.link]"
      >
        <div class="clipped-bg"></div>
        <div class="card-body d-flex flex-column align-items-center justify-content-start w-100 claim-custom-card-body">
          <!-- Icon Image -->
          <img 
            [src]="card.imageUrl" 
            alt="icon" 
            class="rounded-circle mt-1 mb-3 card-icon"
          />
          <!-- Title -->
          <h5 class="card-title mb-2">{{ card.title }}</h5>
          <!-- Description -->
          <p class="card-text mx-2">{{ card.description }}</p>
          <!-- Spacer to push button to bottom -->
          <div class="mt-auto py-1 claim-card-button-container">
            <button [routerLink]="[card.link]" class="btn btn-secondary card-cta">{{ card.buttonLabel || 'FILE CLAIM' }}</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Don't see your claim type section -->
  <div class="claim-contact-section mt-5 mb-4">
    <div class="claim-contact-content">
      <h4 class="claim-contact-title">Don't see your claim type?</h4>
      <p class="claim-contact-desc px-4">If you have a concern that isn't listed, contact us with details for your claim and we'll get back to you.</p>
      <button class="claim-contact-btn" routerLink="/residential/contact-us">CONTACT US</button>
    </div>
  </div>

  <div class="text-center mt-4 mb-5">
    <button (click)="scrollToTop()" class="p-2 back-to-top-sec">
      <img class="back-to-top-icon" src="assets/images/icons/drop-down-arrow.svg" alt="Back to Top"><br/>
      <p class="back-to-top mb-0">Back to Top</p>
    </button>
  </div>
</div>
