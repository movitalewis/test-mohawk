<!-- <app-loader [fullScreen]="true" *ngIf="spinnerLoading"></app-loader> -->
<div class="modal-header text-center">
  <h4 class="modal-title w-100">Share Via Email</h4>
  <button
    type="button"
    class="btn-close close pull-right"
    aria-label="Close"
    (click)="onHideModal()"
  >
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<form [formGroup]="toemailForm">
<div class="modal-body">
  <div class="text-center">
   
    <div class="col-12 mt-2 mb-2 text-start">
      <h4>From:</h4>
      <p>XChange Support (Xchange_Support&#64;mohawkind.com)</p>

    </div>
    <div class="col-12 mt-2 mb-2 text-start">
      <h4>To</h4>
      <textarea
        type="textarea"
        placeholder="Enter email address separated by a comma on the same line"
        class="form-control w-100"
        [class.is-invalid]="
        toemailForm.controls['senderEmail'].touched == true &&
        toemailForm.controls['senderEmail'].hasError('pattern')"
        formControlName="senderEmail"
      ></textarea>
      <p class="text-f-s">Place a comma after each email address.</p>
    </div>

    <div class="col-12 mt-2 mb-2 text-start">
      <h4>Subject</h4>
      <input
        type="type"
        placeholder="Mohawk quote details for -6100001624 - 07/25/2022"
        class="form-control w-100"
        formControlName="subject" [class.is-invalid]="
                    toemailForm.controls['subject'].touched == true &&
                    toemailForm.controls['subject'].hasError('pattern')"
      />
    </div>
  </div>
  <div class="mt-3">
    <alert
        [type]="alertType"
        class="mb-3"
        [dismissible]="true"
        *ngIf="showMessage"
      >
        <div class="container">{{ showMessage }}</div>
    </alert>
</div>
  <div class=" row mt-4 mb-4 p-50">
    <div class="col-12 text-center">
      <button class="btn btn-outline-secondary mb-2" (click)="onHideModal()">
        CANCEL
      </button>
      <button class="btn btn-primary mb-2" (click)="sendEmail()" [disabled]="!toemailForm.valid">SEND</button>
    </div>
  </div>
</div>
</form>
