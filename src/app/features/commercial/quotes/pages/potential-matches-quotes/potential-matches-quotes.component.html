
<div [ngClass]="{ 'modal-hide': !isModalContentVisible }">
<div class="modal-header text-center">
    <h4 class="modal-title w-100">Please review potential duplicate quote</h4>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="onHideModal()">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="text-center">
        <div class="_card-container mt-3">
            <div class="row">
                <div class="mt-4">
                    <app-loader *ngIf="tableLoading"></app-loader>
                    <div class="overflow-auto">
                        <ngx-table [configuration]="configuration" [data]="allquoteData" [columns]="columns"
                        (event)="onsort($event)">
                            <ng-template let-row let-index="index">
                                <td>
                                    {{ row?.state }}
                                </td>
                                <td><span class="icon-sec" (click)="redirectTO(row?.code)">
                                    {{ row?.code }}</span>
                                </td>
                                <td>
                                    {{ row?.endUserDescription }}
                                </td>
                                <td>
                                    {{ row?.description }}
                                </td>
                                <td>
                                    {{ row?.jobLocation }}
                                </td>
                                <td>
                                    {{ row?.expirationTime | date : "MM/dd/yyyy" }}
                                </td>
                                <td>
                                    {{ formatMoney(row?.totalPrice?.value) }}
                                </td>
                            </ng-template>
                        </ngx-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
