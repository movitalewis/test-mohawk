<!-- <app-loader [fullScreen]="true" *ngIf="spinnerLoading"></app-loader> -->
<div class="modal-header">
  <h4 class="modal-title text-center w-100">Invoice Search</h4>
  <button
    type="button"
    class="btn-close close pull-right"
    aria-label="Close"
    (click)="modalService.hide()"
  >
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
    <div class="row" *ngIf="isSearchClicked">
      <alert type="{{alertType}}"  [dismissible]="true">
        <div class="container">{{ alertData.message }}</div>
      </alert>
    </div>
    <div class="row">
    <div class="col-md-4 mb-3">
      <h4>Search By</h4>
      <ng-select
        placeholder="Invoice #"
        [(ngModel)]="searchCriteria.searchType"
        (ngModelChange)="selectSearchBy($event); closeAlert()"
        [clearable]="true"
      >
        <ng-option *ngFor="let option of searchByData" [value]="option.value">{{
          option?.name
        }}</ng-option>
      </ng-select>
    </div>
    <div class="col-md-4 mb-3">
      <h4>Search For</h4>
      <input
        type="text"
        placeholder="Search Invoices"
        class="form-control"
        [(ngModel)]="searchCriteria.searchText"
        [disabled]="searchCriteria.searchType ? false : true"
        (input)="closeAlert()"
        (keydown.enter)="search(true)"
      />
    </div>
    <div class="col-md-4 mb-3">
      <h4>Date Range</h4>
      <input
        type="text"
        placeholder="Select Date"
        class="form-control"
        bsDaterangepicker
        [maxDate]="maxDate"
        [(ngModel)]="searchCriteria.dateText"
        (bsValueChange)="closeAlert()"
      />
    </div>

    <div class="col-md-4 mb-3">
      <h4>Ship To</h4>
      <ng-select class="shipToDropdown" placeholder="Select" [(ngModel)]="searchCriteria.shipTo" (ngModelChange)="closeAlert()">
        <ng-option *ngFor="let item of shipToData" [value]="item?.id"><span [title]="item.name">{{
          item.name
        }}</span></ng-option>
      </ng-select>
    </div>
    <div class="col-md-4 mb-3">
      <h4>One-Time Shipping Address</h4>
      <input
        type="text"
        placeholder="Address, City, State, And zip Code"
        class="form-control"
        [(ngModel)]="searchCriteria.oneTimeShipAddress"
        (input)="closeAlert()"
      />
    </div>
  </div>
  <div class="row full-btns justify-content-center mt-3">
    <div class="col-md-3 btn-grid">
      <button class="btn btn-outline-secondary mb-3" (click)="onHideModal()">
        CANCEL
      </button>
    </div>
    <div class="col-md-3 btn-grid">
      <button class="btn btn-primary mb-3" [disabled]="(searchCriteria.searchType && !searchCriteria.searchText) ? ((searchCriteria.dateText || searchCriteria.shipTo || searchCriteria.oneTimeShipAddress) ? false :true) : false" (click)="search(true)">SEARCH</button>
    </div>
  </div>
</div>
