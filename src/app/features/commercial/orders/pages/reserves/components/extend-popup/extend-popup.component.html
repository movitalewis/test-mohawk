<div class="modal-header text-center">
  <h4 class="modal-title w-100">Reserve Extended</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="onHideModal()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="text-center">
    <p>{{this.reponseMessage}}</p>
    <div class="mt-4 mb-4">
      <button class="btn btn-primary" (click)="onHideModal()">CLOSE</button>
    </div>
  </div>
</div>
