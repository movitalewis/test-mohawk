<app-loader [fullScreen]="true" *ngIf="spinnerLoading"></app-loader>
<div class="modal-header text-center">
  <h4 class="modal-title f-w w-100">Commercial Site Selection</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="onHideModal()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>

<div class="modal-body p-20">
  <h2 class="body-heading">Select your site</h2>
  <ul class="subscribe-list w-100">
    <li *ngFor="let site of commercialSites">
      <div class="box-container" [class.active-card]="selectedSite === site.id" (click)="changeSite($event, site.id)">
        <div class="boxes">
          <div class="icon">
            <img [src]="'/assets/icons/' + (site.name === 'International' 
                ? (selectedSite === site.id ? 'globe-active.svg' : 'globe-inactive.svg')
                : site.name === 'Hospitality' 
                ? (selectedSite === site.id ? 'business-active.svg' : 'business-inactive.svg')
                : (selectedSite === site.id ? 'business-active.svg' : 'business-inactive.svg'))" [alt]="site.name" />
          </div>
          <span class="box-heading">{{site.name}}</span>
        </div>
      </div>
    </li>
  </ul>
  <div class="d-flex footer-btns mt-4 justify-content-center">
    <button class="btn btn-primary" (click)="handleAction()" [disabled]="!selectedSite">
      Continue
    </button>
  </div>
</div>
