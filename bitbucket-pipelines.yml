options:
  max-concurrency: 5

definitions:
  steps:
    - step: &build-and-deploy
        name: Build & Deploy
        image: node:22
        services:
          - docker
        size: 2x
        caches:
          - node
        script:
          # APP_NAME and ENVIRONMENT come from Bitbucket Deployment variables
          # (Repo settings → Deployments → dev / staging / qa).
          # ACR_* and AZURE_* come from Repository variables (shared across envs).
          - export NODE_OPTIONS="--max-old-space-size=6144"
          - npm install --force
          - npm run build-${ENVIRONMENT}:ssr

          - ACR_REPO="${APP_NAME%-*}-frontend"
          - IMAGE="${ACR_SERVER}/${ACR_REPO}/${APP_NAME}:${BITBUCKET_BUILD_NUMBER}"
          - IMAGE_LATEST="${ACR_SERVER}/${ACR_REPO}/${APP_NAME}:latest"
          - echo ${ACR_PASSWORD} | docker login ${ACR_SERVER} -u ${ACR_USERNAME} --password-stdin
          - docker build -t ${IMAGE} -t ${IMAGE_LATEST} .
          - docker push ${IMAGE}
          - docker push ${IMAGE_LATEST}

          - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          - az login --service-principal -u ${AZURE_CLIENT_ID} -p ${AZURE_CLIENT_SECRET} --tenant ${AZURE_TENANT_ID}
          - |
            az containerapp show \
              --name ${APP_NAME} \
              --resource-group ${AZURE_RG} \
              > /dev/null 2>&1 && \
            az containerapp update \
              --name ${APP_NAME} \
              --resource-group ${AZURE_RG} \
              --image ${IMAGE} || \
            az containerapp create \
              --name ${APP_NAME} \
              --resource-group ${AZURE_RG} \
              --environment ${AZURE_CONTAINER_ENV} \
              --image ${IMAGE} \
              --target-port 4800 \
              --ingress external \
              --registry-server ${ACR_SERVER} \
              --registry-username ${ACR_USERNAME} \
              --registry-password ${ACR_PASSWORD} \
              --cpu 1 \
              --memory 2.0Gi \
              --min-replicas 1 \
              --max-replicas 7 \
              --env-vars PORT=4800

pipelines:
  branches:
    develop:
      - step:
          <<: *build-and-deploy
          name: Build & Deploy to Dev
          deployment: dev

    staging:
      - step:
          <<: *build-and-deploy
          name: Build & Deploy to Staging
          deployment: staging

    qa:
      - step:
          <<: *build-and-deploy
          name: Build & Deploy to QA
          deployment: qa
